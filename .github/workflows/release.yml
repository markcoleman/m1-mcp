name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Run tests
        run: npm test
        env:
          DATA_SOURCE: mock
      
      - name: Package build artifacts
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json package-lock.json README.md LICENSE release/ 2>/dev/null || true
          cd release && tar -czf ../m1-mcp-${{ github.ref_name }}.tar.gz .
      
      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-artifacts
          path: |
            m1-mcp-*.tar.gz
            dist/
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      
      - name: Generate changelog
        id: changelog
        run: |
          # Find previous tag safely, handling edge cases
          set +e  # Don't exit on error
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null)
          TAG_SEARCH_EXIT=$?
          set -e  # Re-enable exit on error
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          if [ $TAG_SEARCH_EXIT -ne 0 ] || [ -z "$PREVIOUS_TAG" ]; then
            echo "Initial release" >> $GITHUB_OUTPUT
          else
            # Generate changelog from commits since previous tag
            git log $PREVIOUS_TAG..${{ github.ref_name }} --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT || echo "No commits to list" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            Download the release artifact and extract:
            ```bash
            tar -xzf m1-mcp-${{ github.ref_name }}.tar.gz
            cd release
            npm install --production
            npm start
            ```
            
            Or install from source:
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd m1-mcp
            git checkout ${{ github.ref_name }}
            npm install
            npm run build
            npm start
            ```
          files: |
            m1-mcp-*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm (if configured)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Check if package is private
        id: check-private
        run: |
          # Safely check if package is private, handling malformed JSON
          set +e  # Don't exit on error
          PRIVATE=$(node -p "try { require('./package.json').private || false } catch(e) { console.error('Error reading package.json:', e.message); 'true' }" 2>&1)
          CHECK_EXIT=$?
          set -e  # Re-enable exit on error
          
          if [ $CHECK_EXIT -ne 0 ]; then
            echo "Warning: Could not read package.json, assuming private"
            PRIVATE="true"
          fi
          
          echo "is_private=$PRIVATE" >> $GITHUB_OUTPUT
      
      - name: Publish to npm
        if: steps.check-private.outputs.is_private == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
